<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none;
    user-select: none;
  }

  .pill {
    -webkit-app-region: drag;
    width: 100%;
    height: 100%;
    box-sizing: border-box;
    background: rgba(20, 20, 24, 0.72);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    padding: 4px 8px;
    color: #f0f0f2;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 1px;
    cursor: move;
  }

  #start-line {
    font-size: 9px;
    color: #c7c7cf;
  }

  #duration-line {
    font-size: 11px;
    font-variant-numeric: tabular-nums;
    font-weight: 600;
  }
</style>
</head>
<body>
  <div class="pill">
    <div id="start-line"></div>
    <div id="duration-line">00:00</div>
  </div>
  <script src="info-overlay.js"></script>
</body>
</html>
