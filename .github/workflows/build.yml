name: Build ScreenCircle

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: npx electron-builder --win --config.win.signAndEditExecutable=false --config.directories.output=dist --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: npx electron-builder --mac --config.directories.output=dist --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: screencircle-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
          if-no-files-found: ignore
