<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.25);
    cursor: crosshair;
    overflow: hidden;
    user-select: none;
  }
  #hint {
    position: fixed;
    top: 24px;
    left: 50%;
    transform: translateX(-50%);
    color: #fff;
    font-family: -apple-system, "Segoe UI", sans-serif;
    font-size: 14px;
    background: rgba(0,0,0,0.5);
    padding: 8px 16px;
    border-radius: 8px;
  }
  #selection {
    position: absolute;
    border: 2px solid #4da3ff;
    background: rgba(77, 163, 255, 0.15);
    display: none;
  }
</style>
</head>
<body>
  <div id="hint">Выделите область мышью — Esc для отмены</div>
  <div id="selection"></div>
  <script src="overlay.js"></script>
</body>
</html>
