<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none;
    user-select: none;
  }

  .widget {
    -webkit-app-region: drag;
    background: rgba(30, 31, 36, 0.96);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    padding: 9px 11px;
    box-sizing: border-box;
    width: 100%;
    height: 100%;
    color: #f0f0f2;
    display: flex;
    flex-direction: column;
    gap: 7px;
  }

  .status-row {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 12px;
  }

  .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #ff5c5c;
  }

  .dot.paused {
    background: #ffb84d;
    animation: none !important;
  }

  .dot.recording {
    animation: blink 1s infinite;
  }

  @keyframes blink {
    50% { opacity: 0.25; }
  }

  #timer {
    margin-left: auto;
    font-variant-numeric: tabular-nums;
    color: #cfcfd6;
  }

  .buttons {
    -webkit-app-region: no-drag;
    display: flex;
    gap: 6px;
  }

  button {
    -webkit-app-region: no-drag;
    flex: 1;
    font-family: inherit;
    font-size: 11px;
    border: none;
    border-radius: 7px;
    padding: 6px 6px;
    cursor: pointer;
    white-space: nowrap;
  }

  #pause-btn {
    background: #35363f;
    color: #f0f0f2;
  }

  #pause-btn:hover {
    background: #40414b;
  }

  #stop-btn {
    background: #ff5c5c;
    color: #2b0000;
    font-weight: 600;
  }

  #stop-btn:hover {
    background: #ff7a7a;
  }

  #camera-btn {
    background: #35363f;
    color: #f0f0f2;
  }

  #camera-btn:hover {
    background: #40414b;
  }

  #camera-btn.off {
    color: #8a8a92;
  }

  .hidden {
    display: none !important;
  }
</style>
</head>
<body>
  <div class="widget">
    <div class="status-row">
      <span id="dot" class="dot recording"></span>
      <span id="status-text">Идёт запись</span>
      <span id="timer">00:00</span>
    </div>
    <div class="buttons">
      <button id="pause-btn">Пауза</button>
      <button id="camera-btn" class="hidden">Камера</button>
    </div>
    <div class="buttons">
      <button id="stop-btn">Остановить запись</button>
    </div>
  </div>
  <script src="i18n.js"></script>
  <script src="widget.js"></script>
</body>
</html>
